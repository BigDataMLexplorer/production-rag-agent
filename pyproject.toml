[project]
name = "production-rag-agent"
version = "0.1.0"
description = "Production-style multi-tenant RAG and AI agent portfolio project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "sentence-transformers>=3.3",
  "numpy>=2.1",
  "langgraph>=1.0",
  "pydantic-ai>=1.0",
  "python-multipart>=0.0.17",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "httpx>=0.28",
  "opentelemetry-api>=1.39",
  "opentelemetry-sdk>=1.39",
  "opentelemetry-instrumentation-fastapi>=0.60b0",
  "opentelemetry-exporter-otlp-proto-http>=1.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "matplotlib>=3.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests requiring PostgreSQL/pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
