name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: pytest -q -m 'not integration'

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: PostgreSQL/pgvector integration tests
        run: pytest -q -m integration

  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed synthetic demo data
        run: PYTHONPATH=src python scripts/seed_demo_data.py
      - name: Run measured retrieval evaluation
        run: PYTHONPATH=src python scripts/run_retrieval_evaluation.py
      - name: Build evaluation chart
        run: PYTHONPATH=src python scripts/plot_retrieval_evaluation.py
      - name: Install browser for live demo capture
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start demo API
        run: |
          PYTHONPATH=src uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/rag-api.log 2>&1 &
          echo $! >/tmp/rag-api.pid
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API did not become healthy")
          PY
      - name: Capture live demo screenshot
        run: PYTHONPATH=src python scripts/capture_demo_screenshot.py
      - name: Stop demo API
        if: always()
        run: |
          if [ -f /tmp/rag-api.pid ]; then kill "$(cat /tmp/rag-api.pid)" || true; fi
          if [ -f /tmp/rag-api.log ]; then tail -n 100 /tmp/rag-api.log; fi
      - name: Upload measured evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: |
            artifacts/retrieval_evaluation.json
            artifacts/retrieval_quality.png
            artifacts/demo_chat.png
