name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: pytest -q -m 'not integration'

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: PostgreSQL/pgvector integration tests
        run: pytest -q -m integration

  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed synthetic demo data
        run: PYTHONPATH=src python scripts/seed_demo_data.py
      - name: Run measured retrieval evaluation
        run: PYTHONPATH=src python scripts/run_retrieval_evaluation.py
      - name: Build evaluation chart
        run: PYTHONPATH=src python scripts/plot_retrieval_evaluation.py
      - name: Upload measured evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: |
            artifacts/retrieval_evaluation.json
            artifacts/retrieval_quality.png
